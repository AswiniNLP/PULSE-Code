[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-counterspeech"
version = "0.1.0"
description = "Two-stage style-conditioned counterspeech with LLaDA, LoRA and vector quantization"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
dependencies = [
    "torch==2.8.0",
    "transformers==4.56.1",
    "peft==0.18.1",
    "huggingface-hub==0.35.3",
    "tokenizers==0.22.0",
    "accelerate==1.7.0",
    "safetensors==0.6.2",
    "numpy==1.26.4",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
gpu = ["bitsandbytes==0.46.0"]
evaluation = [
    "nltk>=3.8.1,<4",
    "rouge-score>=0.1.2,<0.2",
    "bert-score>=0.3.13,<0.4",
    "sentence-transformers>=3,<6",
    "detoxify>=0.5.2,<0.6",
    "rapidfuzz>=3,<4",
]
dev = ["ruff==0.14.6"]

[tool.setuptools]
py-modules = ["pulse_core", "pulse_train", "pulse_inference", "generate_vq", "metric"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
